[core]
	repositoryformatversion = 0
	filemode = true
	bare = false
	logallrefupdates = true
[remote "origin"]
	url = https://{{ user }}:{{ token }}@github.com/{{ org }}/{{ repo }}.git
	fetch = +refs/heads/*:refs/remotes/origin/*
[branch "main"]
	remote = origin
	merge = refs/heads/main
[user]
	name = {{ user }}
	email = {{ user }}@{{ org }}.com
