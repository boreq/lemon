{% for profile in profiles %}[{{ profile.name }}]
aws_access_key_id = {{ profile.access_key_id }}
aws_secret_access_key = {{ profile.secret_access_key }}
{% if let Some(session_token) = profile.session_token %}aws_session_token = {{ session_token }}
{% endif %}{% if let Some(region) = profile.region %}region = {{ region }}
{% endif %}
{% endfor %}